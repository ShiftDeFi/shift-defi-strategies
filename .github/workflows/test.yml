name: CI

permissions: {}

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Foundry project
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      ETH_RPC_URL: ${{ secrets.ETH_RPC_URL }}
      BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}
      MONAD_RPC_URL: ${{ secrets.MONAD_RPC_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install npm dependencies
        run: npm install --ignore-scripts

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
        with:
          version: v1.8.3

      - name: Show Forge version
        run: forge --version

      - name: Run Forge fmt
        run: forge fmt --check

      - name: Run Forge build
        run: forge build contracts --sizes

      # Fork tests pin their blocks, so cached RPC state stays valid until a block is bumped.
      - name: Cache fork RPC state
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.foundry/cache/rpc
          key: rpc-${{ hashFiles('test/**/*.sol') }}
          restore-keys: rpc-

      - name: Run Forge tests
        run: FOUNDRY_PROFILE=ir forge test -vvv
